name: build-ipa
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 还原工程文件
        run: |
          mkdir -p Sources
          echo ''  | base64 -D > project.yml
          echo ''   | base64 -D > Sources/AppDelegate.swift
          echo '' | base64 -D > Sources/SceneDelegate.swift
          echo ''   | base64 -D > Sources/WebViewController.swift
          wc -l project.yml Sources/*.swift

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 无签名构建
        run: |
          xcodebuild -project WebShell.xcodeproj -target WebShell -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: 打包 IPA
        run: |
          APP=$(find build "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "WebShell.app" -not -path "*iphonesimulator*" 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 WebShell.app"
            find build -maxdepth 6 -type d
            exit 1
          fi
          echo "APP=$APP"
          rm -rf "$APP/_CodeSignature" Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload WebShell.ipa
          ls -l WebShell.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WebShell-ipa
          path: WebShell.ipa
